<section class="cobertura" aria-labelledby="cobertura-titulo">

    <div class="cobertura__contenedor">

        <!-- ══ Columna de título ══ -->
        <div class="cobertura__texto">
            <h2 id="cobertura-titulo" class="cobertura__titulo">Respaldamos lo que vendemos.</h2>
            <p class="cobertura__parrafo">

            </p>

                    <p class="punto__texto">{{ punto.texto }}</p>
                </div>
            </li>
            }
        </ol>

    </div>
