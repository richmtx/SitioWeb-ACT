<section class="servicios" aria-labelledby="servicios-titulo">

    <h1 id="servicios-titulo" class="servicios__titulo">No solo lo vendemos</h1>

    <!-- ══ Retícula bento: el tipo de tarjeta lo decide la clase ══ -->
    <div class="bento__reticula">
        @for (servicio of servicios; track servicio.clave) {
        <article [id]="servicio.clave"
            class="servicio servicio--{{ servicio.tipo }} servicio--{{ servicio.clave }}">

            <!-- Bloque de color decorativo; el color lo pone la clase de la tarjeta -->
            <div class="servicio__media" aria-hidden="true"></div>

            @if (servicio.tipo === 'foto') {
            <div class="servicio__velo" aria-hidden="true"></div>
            }

            <div class="servicio__cuerpo">
                <p class="servicio__etiqueta">{{ servicio.etiqueta }}</p>
                <h2 class="servicio__titulo">{{ servicio.titulo }}</h2>
                <p class="servicio__texto">{{ servicio.texto }}</p>
            </div>

        </article>
        }
    </div>

</section>
