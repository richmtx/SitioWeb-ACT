<!-- ══ Encabezado de página ══ -->
<section class="encabezado">
    <div class="encabezado__contenido">
        <h1 class="encabezado__titulo">Servicios</h1>
        <p class="encabezado__texto">
            No solo vendemos equipo. Lo instalamos, lo reparamos en nuestro
            laboratorio y capacitamos a quien lo opera.
        </p>
    </div>
</section>

<!-- ══ Tarjetas apiladas ══
     Cada tarjeta es sticky y recibe su índice en --i: con él el CSS calcula
     el top escalonado y el z-index. No hay JavaScript de scroll. -->
<section class="servicios" aria-label="Nuestros servicios">
    <div class="servicios__pila">

        @for (servicio of servicios; track servicio.id) {
        <article class="servicios__tarjeta" [id]="servicio.id" [style.--i]="$index">

            <div class="servicios__cuerpo">
                <p class="servicios__etiqueta">{{ servicio.etiqueta }}</p>
                <h2 class="servicios__titulo">{{ servicio.titulo }}</h2>
                <p class="servicios__texto">{{ servicio.texto }}</p>
            </div>

            <!-- La primera imagen queda a la vista al cargar: va sin lazy -->
            <img class="servicios__imagen" [src]="servicio.imagen" [alt]="servicio.alt" width="1200" height="1200"
                [attr.loading]="$first ? null : 'lazy'">

        </article>
        }

    </div>
</section>
